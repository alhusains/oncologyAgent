[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-ml-agent"
version = "0.1.0"
description = "An intelligent agent framework for automated tabular ML pipelines"
authors = [{name = "Alhusain", email = "alhusain.abdalla@mail.mcgill.ca"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    # LLM & Agent Framework
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    
    # Core Data Science
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    
    # AutoML & Gradient Boosting (AutoGluon will also install these, but explicit versions for compatibility)
    "autogluon.tabular>=1.1.0",  # ADDED: Full AutoML with neural networks
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    
    # Hyperparameter Optimization
    "optuna>=3.4.0",
    
    # Survival Analysis
    "scikit-survival>=0.21.0",
    
    # Model Interpretability
    "shap>=0.42.0",
    "lime>=0.2.0",
    
    # Deep Learning (now in main dependencies for GPU workstation)
    "torch>=2.0.0",
    "tabpfn>=0.1.10",
    "pycox>=0.2.3",
    
    # Visualization & UI
    "gradio>=4.0.0",
    "plotly>=5.15.0",
    "seaborn>=0.12.0",
    "matplotlib>=3.7.0",  # ADDED: Essential for plotting
    
    # Utilities
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",  # CHANGED: Removed strict pin to avoid conflicts
    "rich>=13.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
